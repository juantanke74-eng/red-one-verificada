  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#16051f;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100svh;display:flex;justify-content:center}
    .landing{
      position:relative;
      width:100%;
      max-width:1080px;
      min-height:100svh;
      background:#16051f;
      overflow:hidden;
    }
    .hero{
      display:block;
      width:100%;
      height:auto;
      min-height:100svh;
      object-fit:cover;
      object-position:center top;
    }
    .cta-wrap{
      position:fixed;
      left:50%;
      bottom:max(20px,env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:10;
      width:min(92%,520px);
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .cta{
      pointer-events:auto;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:17px 22px;
      border-radius:999px;
      background:#25D366;
      color:#fff;
      text-decoration:none;
      font-size:clamp(18px,4.6vw,22px);
      font-weight:800;
      letter-spacing:.1px;
      box-shadow:0 10px 30px rgba(0,0,0,.42),0 0 0 2px rgba(255,255,255,.16) inset;
      animation:pulse 1.9s ease-in-out infinite;
    }
    .wa{
      width:25px;height:25px;border-radius:50%;
      display:grid;place-items:center;
      background:#fff;color:#25D366;
      font-weight:900;font-size:17px;
    }
    @keyframes pulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.035)}
    }
    @media (min-width:800px){
      .hero{min-height:auto}
      .landing{min-height:auto}
    }
    @media (prefers-reduced-motion:reduce){
      .cta{animation:none}
    }
  </style>
</head>
<body>
  <main class="landing">
    <img class="hero" src="principal.png" alt="GANAMOS">
  </main>

  <div class="cta-wrap">
    <a class="cta" href="https://www.linkify.com.ar/api/soporte?id=1clkem" target="_blank" rel="noopener noreferrer">
      <span class="wa">☎</span>
      Hablar por WhatsApp
    </a>
  </div>
</body>
